micronaut-neo4j = "6.11.0"
micronaut-mongodb = "5.7.0"
micronaut-elasticsearch = "5.10.0"
micronaut-redis = "6.9.0"
micronaut-test = "4.10.2"
micronaut-test-resources = "2.10.1"
micronaut-logging = "1.7.1"
micronaut-gradle-plugin = "4.5.4"
micronaut-sourcegen = "1.8.2"
micronaut-grpc = "4.12.0"
micronaut-oraclecloud = "5.5.2"
groovy = "4.0.23"
